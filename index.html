const rupiah = (n) => `Rp ${Number(n||0).toLocaleString('id-ID')}`;
const fmtDate = (s) => { if(!s) return '-'; const d=new Date(s); return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); };
const fmtDT   = (s) => { if(!s) return '-'; const d=new Date(s); return d.toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); };

const saveTransactionToGoogleSheet = async (transaction) => {
  try {
    const payload = {
      ...transaction,
      type: 'expense'  // ← EXPLICIT: Pastikan type='expense'
    };
    
    console.log('📤 Sending EXPENSE to Google Sheets:', payload);

    await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'application/json'
      },

    console.log('✅ EXPENSE berhasil dikirim ke Google Sheets');
  } catch (err) {
    console.error('❌ Gagal sync EXPENSE ke Google Sheets', err);
  }
};

const saveIncomeToGoogleSheet = async (income) => {
  try {
    const payload = {
      ...income,
      type: 'income'  // ← EXPLICIT: Pastikan type='income'
    };
    
    console.log('📤 Sending INCOME to Google Sheets:', payload);

    await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',

        'Content-Type': 'application/json'
      },

    });

  } catch (err) {
    console.error('❌ Gagal sync INCOME ke Google Sheets', err);
  }
};

const loadTransactionsFromGoogleSheet = async () => {
  try {
    const res = await fetch(GOOGLE_SCRIPT_URL);
    const data = await res.json();

    if (Array.isArray(data)) {
      // Pisahkan antara expense dan income
      const expenses = data.filter(d => d.type === 'expense' || !d.type);
      const incomes = data.filter(d => d.type === 'income');
      
      DB.set('opex_transactions', expenses);
      DB.set('opex_incomes', incomes);
      
      return { expenses, incomes };
    }

    return { expenses: [], incomes: [] };
  } catch (err) {
    console.error('Gagal load data Google Sheets', err);
    return { expenses: [], incomes: [] };
  }
};

const syncDataFromGoogleSheet = async (setTxns, setIncomes) => {
  try {
    const { expenses, incomes } = await loadTransactionsFromGoogleSheet();
    if (expenses.length > 0) setTxns(expenses);
    if (incomes.length > 0) setIncomes(incomes);
  } catch (err) {
    console.error('Gagal sync dari Google Sheets', err);
  }
};

/* ─── localStorage helpers ─── */
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwXbOlO-AULsjvkz1cRB-Vbv_7_YjN1I1GYbFE5rGnXes9vFztD7ybM5TuTPxmIOSgA/exec';

const DB = {

  set:(k,v) => { try { localStorage.setItem(k,JSON.stringify(v)); } catch {} },
  rm :(k)   => localStorage.removeItem(k),
};

const initDB = () => {
  // Bersihkan transaksi rejected setiap browser refresh
  const existingTransactions = DB.get('opex_transactions', []);

  // Hanya simpan pending & approved
  const filteredTransactions = existingTransactions.filter(
    t => t.status === 'pending' || t.status === 'approved'

  // Simpan ulang hasil filter ke localStorage

  if (!DB.get('opex_v2')) {
    DB.set('opex_categories', DEFAULT_CATEGORIES);
    DB.set('opex_transactions', filteredTransactions);
    DB.set('opex_v2', true);
  }
};

const OCR_TEMPLATES = [

  { merchant_name:'Tol Jakarta–Cikampek KM 34', amount:9000, category:'Gerbang Toll', payment_method:'E-Toll', notes:'' },
  { merchant_name:'Alfamart Menteng Raya', amount:42000, category:'Alat Tulis Kantor', payment_method:'Debit BCA', notes:'Kertas HVS + tinta printer' },
];

const simulateOCR = (filename = '') => {
  const fn = filename.toLowerCase();
  let tpl;
  if (fn.includes('parkir') || fn.includes('park') || fn.includes('tiket') || fn.includes('karcis'))
    tpl = OCR_TEMPLATES[0];
  else if (fn.includes('toll') || fn.includes('tol'))
    tpl = OCR_TEMPLATES[1];
  else if (fn.includes('makan') || fn.includes('resto') || fn.includes('cafe'))
    tpl = OCR_TEMPLATES[2];
  else if (fn.includes('bbm') || fn.includes('spbu') || fn.includes('bensin'))
    tpl = OCR_TEMPLATES[5];
  else
    tpl = OCR_TEMPLATES[Math.floor(Math.random() * OCR_TEMPLATES.length)];

  return { transaction_date: today(), ...tpl };
};

const callAnthropicOCR = async (dataUrl, apiKey) => {
  const mt = dataUrl.startsWith('data:image/png') ? 'image/png'
           : dataUrl.startsWith('data:image/gif') ? 'image/gif'
           : dataUrl.startsWith('data:image/webp') ? 'image/webp'
           : 'image/jpeg';
  const b64 = dataUrl.split(',')[1];

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      messages: [{
        role: 'user',
        content: [
          { type:'image', source:{ type:'base64', media_type:mt, data:b64 } },
          { type:'text', text:`Kamu adalah mesin OCR khusus bukti transaksi operasional.
Baca gambar ini dan ekstrak data ke dalam JSON valid (HANYA JSON, tanpa teks lain):

{
  "transaction_date": "YYYY-MM-DD",
  "merchant_name": "nama lengkap merchant/toko/lokasi",
  "amount": angka_integer_tanpa_format,
  "category": "pilih salah satu: Parkir, Gerbang Toll, Makan & Minum, Transport, Alat Tulis Kantor, Komunikasi, Akomodasi, Bahan Bakar, Lainnya",
  "payment_method": "Tunai atau nama e-wallet/kartu",
  "notes": "catatan singkat relevan"
}

Aturan:
- transaction_date: gunakan tanggal dari struk, jika tidak ada pakai hari ini (${today()})
- amount: hanya angka integer, tanpa Rp atau titik/koma
- Jika ada kata "Parkir"/"PARKIR"/"tiket" → category = Parkir
- Jika ada kata "TOL"/"TOLL"/"gerbang" → category = Gerbang Toll
- Jika tidak jelas → Lainnya` }
        ]
      }]
    })
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || `HTTP ${res.status}`);
  }
  const data = await res.json();
  const raw = data.content?.map(c => c.text||'').join('') || '{}';
  const clean = raw.replace(/```json|```/g,'').trim();
  return JSON.parse(clean);
};

const LoginPage = ({ onLogin }) => {

  const [busy, setBusy]   = useState(false);

    e.preventDefault(); setErr(''); setBusy(true);
    await new Promise(r => setTimeout(r, 700));
    const u = USERS_DB.find(x => x.email === email && x.password === pass);
    if (u) { DB.set('opex_session', { id:u.id, email:u.email, name:u.name, role:u.role, initials:u.initials }); onLogin(u); }
    else setErr('Username atau password salah');
    setBusy(false);
  };

    <div className="min-h-screen bg-zinc-950 flex items-center justify-center p-4 relative overflow-hidden">
      {/* Grid background */}
      <div className="absolute inset-0 opacity-[0.03]" style={{backgroundImage:'linear-gradient(#06b6d4 1px,transparent 1px),linear-gradient(90deg,#06b6d4 1px,transparent 1px)',backgroundSize:'40px 40px'}} />

        {/* Brand */}

          <div className="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-zinc-900 border border-zinc-800 mb-4 glow-ring" style={{boxShadow:'0 0 0 1px rgba(6,182,212,.15),inset 0 1px 0 rgba(255,255,255,.05)'}}>
            <span className="text-2xl">🧾</span>
          </div>
          <h1 className="text-2xl font-bold text-zinc-100 tracking-tight">Tracker Flazz</h1>
          <p className="text-sm text-zinc-500 mt-1">Operational Expense Deployment ReCharge</p>
        </div>

        <div className="bg-zinc-900/80 backdrop-blur border border-zinc-800 rounded-2xl p-6 shadow-2xl" style={{boxShadow:'0 0 0 1px rgba(255,255,255,.04),0 24px 48px rgba(0,0,0,.4)'}}>
          <p className="text-xs font-semibold text-zinc-500 uppercase tracking-widest mb-5">Masuk ke Akun</p>

          {err && (
            <div className="mb-4 flex items-center gap-2 p-3 bg-rose-500/5 border border-rose-500/20 rounded-lg">
              <span className="text-rose-400 text-sm">⚠</span>
              <span className="text-sm text-rose-400">{err}</span>

              style={{boxShadow:'0 4px 14px rgba(6,182,212,.2)'}}>
              {busy ? <><Spin size="sm"/><span>Memproses...</span></> : 'Masuk →'}
            </button>
          </form>

          {/* Demo creds */}
          <div className="hidden">
            <p className="text-xs text-zinc-600 font-medium">Quick Login Demo:</p>

  const compressImage = (file) => new Promise(res => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX = 1200;
        let { width:w, height:h } = img;
        if (w > MAX || h > MAX) { if (w > h) { h = Math.round(h*MAX/w); w=MAX; } else { w=Math.round(w*MAX/h); h=MAX; } }
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        res({ preview:canvas.toDataURL('image/jpeg',0.82), name:file.name, size:file.size });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });

  const loadFiles = (raw) => {
    const valid = Array.from(raw).filter(f=>f.type.startsWith('image/'));

const TxnList = ({ txns, cats, user, onUpdate, toast }) => {
  const [q,      setQ]      = useState('');
  const [fCat,   setFCat]   = useState('');
  const [fStat,  setFStat]  = useState('');
  const [fDate,  setFDate]  = useState('');
  const [fMin,   setFMin]   = useState('');
  const [fMax,   setFMax]   = useState('');
  const [page,   setPage]   = useState(1);
  const [detail, setDetail] = useState(null);
  const [sort,   setSort]   = useState({ key:'created_at', dir:-1 });
  const PER = 10;

  const filtered = useMemo(() => {
    let a = [...txns];
    if (q)     a = a.filter(t => `${t.merchant_name} ${t.notes} ${t.category}`.toLowerCase().includes(q.toLowerCase()));
    if (fCat)  a = a.filter(t => t.category === fCat);
    if (fStat) a = a.filter(t => t.status === fStat);
    if (fDate) a = a.filter(t => t.transaction_date === fDate);
    if (fMin)  a = a.filter(t => Number(t.amount) >= Number(fMin));
    if (fMax)  a = a.filter(t => Number(t.amount) <= Number(fMax));
    a.sort((x,y) => {
      const v = sort.key==='amount' ? Number(x[sort.key])-Number(y[sort.key])
              : sort.key==='transaction_date' ? x[sort.key].localeCompare(y[sort.key])
              : new Date(x[sort.key])-new Date(y[sort.key]);
      return v * sort.dir;
    });
    return a;
  }, [txns, q, fCat, fStat, fDate, fMin, fMax, sort]);

  const pages  = Math.ceil(filtered.length / PER);
  const paged  = filtered.slice((page-1)*PER, page*PER);
  const total  = filtered.reduce((s,t)=>s+Number(t.amount||0),0);

  const thClass = "px-4 py-3 text-left text-xs font-medium text-zinc-500 uppercase tracking-wider cursor-pointer hover:text-zinc-300 select-none whitespace-nowrap";
  const TH = ({ k, children }) => (
    <th className={thClass} onClick={() => setSort(s => s.key===k ? { key:k, dir:-s.dir } : { key:k, dir:-1 })}>
      {children} {sort.key===k ? (sort.dir===-1 ? '↓' : '↑') : ''}
    </th>
  );

  const exportCSV = () => {
    const h = 'ID,Tanggal,Merchant,Nominal,Kategori,Metode,Status,Catatan';
    const rows = filtered.map(t=>[t.id,t.transaction_date,`"${t.merchant_name}"`,t.amount,t.category,t.payment_method,t.status,`"${t.notes||''}"`].join(','));
    const blob = new Blob([h+'\n'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    Object.assign(document.createElement('a'),{href:url,download:`opex-${Date.now()}.csv`}).click();
    toast('Export CSV berhasil','success');
  };

  const exportExcel = () => {
    try {
      const data = filtered.map(t=>({ ID:t.id, Tanggal:t.transaction_date, Merchant:t.merchant_name, Nominal:t.amount, Kategori:t.category, Metode:t.payment_method||'-', Status:t.status, Catatan:t.notes||'' }));
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,ws,'Transaksi');
      XLSX.writeFile(wb,`opex-${Date.now()}.xlsx`);
      toast('Export Excel berhasil','success');
    } catch { toast('Gagal export Excel — pastikan browser mendukung','error'); }
  };

  const exportPDF = () => {
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation:'landscape' });
      doc.setFontSize(14);
      doc.setTextColor(30,30,30);
      doc.text('Laporan Transaksi Operasional — OpEx Tracker', 14, 16);
      doc.setFontSize(9);
      doc.setTextColor(120);
      doc.text(`Digenerate: ${new Date().toLocaleString('id-ID')} | Total: ${rupiah(total)} | ${filtered.length} transaksi`, 14, 23);
      doc.autoTable({
        head:[['Tanggal','Merchant','Nominal','Kategori','Metode','Status','Catatan']],
        body:filtered.map(t=>[t.transaction_date,t.merchant_name,rupiah(t.amount),t.category,t.payment_method||'-',t.status,t.notes||'']),
        startY:28, theme:'grid', styles:{ fontSize:8, cellPadding:3 },
        headStyles:{ fillColor:[9,9,11], textColor:[200,200,200], fontStyle:'bold' },
        alternateRowStyles:{ fillColor:[248,248,248] },
      });
      doc.save(`opex-${Date.now()}.pdf`);
      toast('Export PDF berhasil','success');
    } catch(e) { toast('Gagal export PDF: '+e.message,'error'); }
  };

  const resetFilter = () => { setQ(''); setFCat(''); setFStat(''); setFDate(''); setFMin(''); setFMax(''); setPage(1); };
  const hasFilter = q || fCat || fStat || fDate || fMin || fMax;

  return (
    <div className="space-y-4 fade-up">
      {/* Header */}
      <div className="flex flex-wrap items-start justify-between gap-3">
        <div>
          <h1 className="text-xl font-bold text-zinc-100">Daftar Transaksi</h1>
          <p className="text-sm text-zinc-500">
            {filtered.length} transaksi · Total: <span className="font-mono text-cyan-400 font-semibold">{rupiah(total)}</span>
          </p>
        </div>
        <div className="flex gap-2 flex-wrap">
          <button onClick={exportCSV}   className="text-xs border border-zinc-700 hover:border-zinc-600 text-zinc-400 hover:text-zinc-200 px-3 py-1.5 rounded-lg transition-colors">⬇ CSV</button>
          <button onClick={exportExcel} className="text-xs border border-zinc-700 hover:border-zinc-600 text-zinc-400 hover:text-zinc-200 px-3 py-1.5 rounded-lg transition-colors">⬇ Excel</button>
          <button onClick={exportPDF}   className="text-xs border border-zinc-700 hover:border-zinc-600 text-zinc-400 hover:text-zinc-200 px-3 py-1.5 rounded-lg transition-colors">⬇ PDF</button>
        </div>
      </div>

      {/* Filters */}
      <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-4">
        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
          <div className="col-span-2 sm:col-span-3 lg:col-span-2">
            <input value={q} onChange={e=>{setQ(e.target.value);setPage(1);}} placeholder="🔍 Cari merchant, catatan..."
              className="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-cyan-500" />
          </div>
          <select value={fCat} onChange={e=>{setFCat(e.target.value);setPage(1);}}
            className="bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-zinc-400 focus:outline-none focus:border-cyan-500">
            <option value="">Semua Kategori</option>
            {cats.map(c=><option key={c.id} value={c.name}>{c.icon} {c.name}</option>)}
          </select>
          <select value={fStat} onChange={e=>{setFStat(e.target.value);setPage(1);}}
            className="bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-zinc-400 focus:outline-none focus:border-cyan-500">
            <option value="">Semua Status</option>
            <option value="pending">⏳ Menunggu</option>
            <option value="approved">✅ Disetujui</option>
            <option value="rejected">❌ Ditolak</option>
          </select>
          <input type="date" value={fDate} onChange={e=>{setFDate(e.target.value);setPage(1);}}
            className="bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-zinc-400 focus:outline-none focus:border-cyan-500" />
          <div className="flex gap-1.5">
            <input type="number" value={fMin} onChange={e=>{setFMin(e.target.value);setPage(1);}} placeholder="Min Rp"
              className="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-2 py-2 text-xs text-zinc-400 focus:outline-none focus:border-cyan-500" />
            {hasFilter && <button onClick={resetFilter} className="flex-shrink-0 text-xs text-zinc-600 hover:text-zinc-300 px-2 rounded-lg border border-zinc-700 hover:border-zinc-600 transition-colors">✕</button>}
          </div>
        </div>
      </div>

      {/* Table */}
      <div className="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="border-b border-zinc-800">
              <tr>
                <TH k="transaction_date">Tanggal</TH>
                <TH k="merchant_name">Merchant</TH>
                <TH k="amount">Nominal</TH>
                <th className={thClass}>Kategori</th>
                <th className={thClass}>Metode</th>
                <TH k="status">Status</TH>
                <th className="px-4 py-3 w-8"></th>
              </tr>
            </thead>
            <tbody>
              {paged.length === 0 ? (
                <tr><td colSpan={7} className="text-center py-16 text-zinc-600">
                  <div className="flex flex-col items-center gap-2">
                    <span className="text-3xl">🔍</span>
                    <p>Tidak ada transaksi yang cocok</p>
                    {hasFilter && <button onClick={resetFilter} className="text-xs text-cyan-500 hover:text-cyan-400">Reset filter</button>}
                  </div>
                </td></tr>
              ) : paged.map(t => (
                <tr key={t.id} className="border-b border-zinc-800/40 row-hover cursor-pointer transition-colors" onClick={() => setDetail(t)}>
                  <td className="px-4 py-3.5 text-zinc-400 text-xs whitespace-nowrap">{fmtDate(t.transaction_date)}</td>
                  <td className="px-4 py-3.5 max-w-48">
                    <p className="text-zinc-200 font-medium text-sm truncate">{t.merchant_name}</p>
                    {t.notes && <p className="text-zinc-600 text-xs truncate mt-0.5">{t.notes}</p>}
                  </td>
                  <td className="px-4 py-3.5 font-mono text-zinc-100 text-sm whitespace-nowrap font-semibold">{rupiah(t.amount)}</td>
                  <td className="px-4 py-3.5"><CatBadge c={t.category} /></td>
                  <td className="px-4 py-3.5 text-zinc-500 text-xs whitespace-nowrap">{t.payment_method||'—'}</td>
                  <td className="px-4 py-3.5"></td>
                  <td className="px-4 py-3.5 text-zinc-600 text-xs">→</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        {/* Pagination */}
        {pages > 1 && (
          <div className="flex items-center justify-between px-4 py-3 border-t border-zinc-800">
            <p className="text-xs text-zinc-600">Halaman <span className="text-zinc-400 font-medium">{page}</span> dari {pages} · {filtered.length} data</p>
            <div className="flex items-center gap-1">
              <button disabled={page===1} onClick={()=>setPage(1)} className="w-7 h-7 text-xs rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-500 disabled:opacity-25 transition-colors">«</button>
              <button disabled={page===1} onClick={()=>setPage(p=>p-1)} className="w-7 h-7 text-xs rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-500 disabled:opacity-25 transition-colors">‹</button>
              {Array.from({length:pages},(_, i)=>i+1).filter(p => Math.abs(p-page)<=2 || p===1 || p===pages).reduce((acc,p,i,arr)=>{
                if(i>0 && p - arr[i-1] > 1) acc.push(<span key={`e${p}`} className="text-zinc-700 text-xs px-1">…</span>);
                acc.push(
                  <button key={p} onClick={()=>setPage(p)} className={`w-7 h-7 text-xs rounded font-medium transition-colors ${page===p ? 'bg-cyan-500 text-zinc-950' : 'bg-zinc-800 hover:bg-zinc-700 text-zinc-400'}`}>{p}</button>
                ); return acc;
              }, [])}
              <button disabled={page===pages} onClick={()=>setPage(p=>p+1)} className="w-7 h-7 text-xs rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-500 disabled:opacity-25 transition-colors">›</button>
              <button disabled={page===pages} onClick={()=>setPage(pages)} className="w-7 h-7 text-xs rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-500 disabled:opacity-25 transition-colors">»</button>
            </div>
          </div>
        )}
      </div>

      {/* ── Detail Modal ── */}
      {detail && (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 fade-in" onClick={()=>setDetail(null)}>
          <div className="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-lg shadow-2xl fade-up overflow-hidden" onClick={e=>e.stopPropagation()} style={{boxShadow:'0 0 0 1px rgba(255,255,255,.05),0 32px 64px rgba(0,0,0,.5)'}}>
            {/* Modal header */}
            <div className="flex items-center justify-between px-5 py-4 border-b border-zinc-800">
              <div className="flex items-center gap-2">
                <span className="text-lg">{DEFAULT_CATEGORIES.find(c=>c.name===detail.category)?.icon||'📦'}</span>
                <h3 className="font-semibold text-zinc-100 text-sm">Detail Transaksi</h3>
              </div>
              <div className="flex items-center gap-2">
                
                <button onClick={()=>setDetail(null)} className="text-zinc-600 hover:text-zinc-300 text-lg leading-none transition-colors ml-1">×</button>
              </div>
            </div>

            {/* Receipt preview */}
            {detail.receipt_image_url && (
              <div className="border-b border-zinc-800 bg-zinc-950 max-h-52 flex items-center justify-center overflow-hidden">
                <img src={detail.receipt_image_url} alt="Struk" className="max-h-52 w-auto object-contain" />
              </div>
            )}

            <div className="p-5 space-y-4">
              {/* Amount highlight */}
              <div className="text-center py-3 bg-zinc-800/40 rounded-xl">
                <p className="text-xs text-zinc-500 mb-1">Nominal Transaksi</p>
                <p className="text-3xl font-bold font-mono text-cyan-400">{rupiah(detail.amount)}</p>
              </div>

              {/* Detail grid */}
              <div className="grid grid-cols-2 gap-2.5">
                {[
                  { l:'Merchant',   v:detail.merchant_name },
                  { l:'Tanggal',    v:fmtDate(detail.transaction_date) },
                  { l:'Kategori',   v:detail.category },
                  { l:'Metode',     v:detail.payment_method||'—' },
                  { l:'Dibuat',     v:fmtDT(detail.created_at) },
                  { l:'ID',         v:detail.id, mono:true },
                ].map(({ l,v,mono }) => (
                  <div key={l} className="bg-zinc-800/50 rounded-lg p-3">
                    <p className="text-[10px] text-zinc-600 uppercase tracking-wider mb-0.5">{l}</p>
                    <p className={`text-sm font-medium text-zinc-200 truncate ${mono?'font-mono text-xs text-zinc-500':''}`}>{v}</p>
                  </div>
                ))}
              </div>

              {detail.notes && (
                <div className="bg-zinc-800/40 rounded-lg px-3 py-2.5">
                  <p className="text-[10px] text-zinc-600 uppercase tracking-wider mb-1">Catatan</p>
                  <p className="text-sm text-zinc-300">{detail.notes}</p>
                </div>
              )}

              {/* Admin approve / reject */}
              {user.role==='admin' && detail.status==='pending' && (
                <div className="grid grid-cols-2 gap-2 pt-1">
                  <button onClick={()=>{ onUpdate(detail.id,{status:'approved'}); toast('✅ Transaksi disetujui','success'); setDetail(null); }}
                    className="py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-sm rounded-xl transition-colors flex items-center justify-center gap-1.5">
                    <span>✓</span> Setujui
                  </button>
                  <button onClick={()=>{ onUpdate(detail.id,{status:'rejected'}); toast('❌ Transaksi ditolak','warning'); setDetail(null); }}
                    className="py-2.5 bg-rose-600/80 hover:bg-rose-600 text-white font-semibold text-sm rounded-xl transition-colors flex items-center justify-center gap-1.5">
                    <span>✕</span> Tolak
                  </button>
                </div>
              )}
              {user.role==='admin' && detail.status==='approved' && (
                <button onClick={()=>{ onUpdate(detail.id,{status:'rejected'}); toast('Transaksi dibatalkan persetujuannya','warning'); setDetail(null); }}
                  className="w-full py-2.5 border border-rose-700/40 hover:border-rose-700 text-rose-500 hover:text-rose-400 font-medium text-sm rounded-xl transition-all">
                  Batalkan Persetujuan
                </button>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

const CatsPage = ({ cats, setCats, toast }) => {
  const [name, setName]     = useState('');
  const [icon, setIcon]     = useState('📦');
  const [desc, setDesc]     = useState('');
  const ICONS = ['📦','🅿️','🛣️','🍽️','🚗','✏️','📱','🏨','⛽','🏥','💻','🎫','🛒','📮','🔧','📞','🍜','☕','🎓','🏋️'];

  const add = () => {
    if (!name.trim()) return toast('Nama kategori wajib diisi','error');
    if (cats.find(c=>c.name.toLowerCase()===name.toLowerCase())) return toast('Kategori sudah ada','error');
    const updated = [...cats, { id:`cat-${Date.now()}`, name:name.trim(), icon, description:desc, color:'gray' }];
    setCats(updated); DB.set('opex_categories',updated);
    setName(''); setDesc(''); setIcon('📦');
    toast('Kategori ditambahkan','success');
  };

  const del = (id) => {
    const updated = cats.filter(c=>c.id!==id);
    setCats(updated); DB.set('opex_categories',updated);
    toast('Kategori dihapus','success');
  };

  return (
    <div className="max-w-2xl space-y-6 fade-up">
      <div>
        <h1 className="text-xl font-bold text-zinc-100">Pengaturan Kategori</h1>
        <p className="text-sm text-zinc-500">Kelola kategori pengeluaran operasional</p>
      </div>

      <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-5 space-y-4">
        <p className="text-sm font-semibold text-zinc-300">Tambah Kategori Baru</p>
        <div className="grid grid-cols-3 gap-3">
          <div className="col-span-2">
            <Input label="Nama Kategori" type="text" value={name} onChange={e=>setName(e.target.value)} placeholder="Nama kategori..." />
          </div>
          <Select label="Icon" value={icon} onChange={e=>setIcon(e.target.value)} options={ICONS.map(ic=>[ic,ic])} />
        </div>
        <Input label="Deskripsi (opsional)" type="text" value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Keterangan singkat..." />
        <div className="flex items-center gap-3">
          <button onClick={add} className="bg-cyan-500 hover:bg-cyan-400 text-zinc-950 font-semibold px-5 py-2 rounded-lg text-sm transition-colors">
            + Tambah
          </button>
          <p className="text-xs text-zinc-600">Preview: <span className="text-lg">{icon}</span> {name||'Nama Kategori'}</p>
        </div>
      </div>

      <div className="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden">
        <div className="px-4 py-3 border-b border-zinc-800">
          <p className="text-xs font-medium text-zinc-500 uppercase tracking-wider">Daftar Kategori ({cats.length})</p>
        </div>
        {cats.map((c,i) => (
          <div key={c.id} className={`flex items-center gap-4 px-4 py-3.5 row-hover transition-colors ${i>0?'border-t border-zinc-800/40':''}`}>
            <span className="text-2xl flex-shrink-0">{c.icon}</span>
            <div className="flex-1 min-w-0">
              <p className="text-sm font-semibold text-zinc-200">{c.name}</p>
              {c.description && <p className="text-xs text-zinc-600 truncate">{c.description}</p>}
            </div>
            <button onClick={()=>del(c.id)} className="text-xs text-zinc-600 hover:text-rose-400 px-2.5 py-1 rounded-lg hover:bg-rose-500/10 border border-transparent hover:border-rose-500/20 transition-all">
              Hapus
            </button>
          </div>
        ))}
      </div>
    </div>
  );
};

          <Input label="Anthropic API Key" type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="sk-ant-api03-R2D...igAAz" />
          <p className="text-xs text-zinc-600 mt-1.5">Biarkan kosong untuk mode simulasi OCR demo. Dapatkan API key di <span className="text-cyan-600">console.anthropic.com</span></p>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={()=>{ DB.set('opex_api_key',apiKey); toast('Pengaturan disimpan','success'); }} className="bg-cyan-500 hover:bg-cyan-400 text-zinc-950 font-semibold px-4 py-2 rounded-lg text-sm transition-colors">Simpan</button>
          {DB.get('opex_api_key') && <button onClick={()=>{ setApiKey(''); DB.rm('opex_api_key'); toast('API key dihapus','success'); }} className="text-xs text-zinc-600 hover:text-rose-400 transition-colors">Hapus Key</button>}
        </div>
        <div className="p-3 bg-zinc-800/40 rounded-lg">
          <p className="text-xs text-zinc-500">Status: {DB.get('opex_api_key') ? <span className="text-emerald-400 font-medium">✓ API Key Aktif — OCR nyata</span> : <span className="text-amber-400 font-medium">⚠ Mode Demo — OCR simulasi</span>}</p>
        </div>
      </div>

      <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-5 space-y-3">
        <div className="flex items-center gap-2">
          <span>🗄️</span>
        </div>
        <p className="text-xs text-zinc-500">Data tersimpan di localStorage browser Anda. Reset untuk mengembalikan ke data dummy awal.</p>
        <button onClick={()=>{ if(confirm('Reset semua data ke kondisi awal?')){ DB.rm('opex_v2'); DB.rm('opex_transactions'); DB.rm('opex_categories'); initDB(); location.reload(); } }}
          className="text-sm border border-rose-700/40 hover:border-rose-600/60 text-rose-500 hover:text-rose-400 px-4 py-2 rounded-lg transition-all">
          ⟳ Reset ke Data Dummy
        </button>
      </div>

      <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-5">
        <div className="space-y-2 text-xs">
          {[['Nama','OpEx Tracker'],['Versi','1.0.0'],['Model AI','claude-sonnet-4-20250514'],['Storage','localStorage (Browser)'],['Framework','React 18 + TailwindCSS'],['Export','CSV · Excel (XLSX) · PDF']].map(([l,v])=>(
            <div key={l} className="flex justify-between py-1.5 border-b border-zinc-800/40 last:border-0">
              <span className="text-zinc-500">{l}</span><span className="font-mono text-zinc-400">{v}</span>

      <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-5">
        <div className="space-y-2">
          {USERS_DB.map(u=>(
            <div key={u.id} className="flex items-center justify-between p-3 bg-zinc-800/40 rounded-lg">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-full bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-xs font-bold text-cyan-400">{u.initials}</div>

                  <p className="text-sm font-medium text-zinc-200">{u.name}</p>

};

/* ═══════════════════════════════════════════
   ROOT APP
═══════════════════════════════════════════ */
const App = () => {
  const [user,  setUser]  = useState(null);
  const [view,  setView]  = useState('dashboard');
  const [txns, setTxns] = useState(() => DB.get('opex_transactions', []));
  const [incomes, setIncomes] = useState(() => DB.get('opex_incomes', []));
  const [cats, setCats] = useState(() => DB.get('opex_categories', []));
  const [toasts, setToasts] = useState([]);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [ocring] = useState(false);
  const [ocrOk] = useState(false);
  const [showKey] = useState(false);
  const [apiKey] = useState('');

  // Sync dari Google Sheets saat pertama kali load
  useEffect(() => {
    initDB();
    const sess = DB.get('opex_session');
    if (sess) setUser(sess);
    setCats(DB.get('opex_categories', DEFAULT_CATEGORIES));

    // Load & sync data dari Google Sheets
    syncDataFromGoogleSheet(setTxns, setIncomes);
  }, []);

  // Periodic sync dari Google Sheets setiap 5 detik
  useEffect(() => {
    const interval = setInterval(async () => {
      const { expenses, incomes: latestIncomes } = await loadTransactionsFromGoogleSheet();
      if (expenses.length > 0) setTxns(expenses);
      if (latestIncomes.length > 0) setIncomes(latestIncomes);
    }, 5000);

    return () => clearInterval(interval);
  }, []);

  const addToast = useCallback((message, type='info') => {
    const id = Date.now() + Math.random();
    setToasts(p => [...p, { id, message, type }]);
    setTimeout(() => setToasts(p => p.filter(t=>t.id!==id)), 4500);
  }, []);

  const removeToast = useCallback((id) => setToasts(p => p.filter(t=>t.id!==id)), []);

  const login  = (u) => setUser(u);
  const logout = () => { DB.rm('opex_session'); setUser(null); };

  const saveTxn = (t) => {
    const updated = [t, ...txns];
    setTxns(updated); DB.set('opex_transactions', updated);
    setView('transactions');
  };

  const saveIncome = (t) => {
    const updated = [t, ...incomes];
    setIncomes(updated); DB.set('opex_incomes', updated);
    setView('income_transactions');
  };

  const updateTxn = async (id, patch) => {
    const updated = txns.map(t =>
      t.id === id ? { ...t, ...patch } : t
    );

    setTxns(updated);

    DB.set('opex_transactions', updated);

    if (patch.status) {
      await updateTransactionStatus(id, patch.status);
    }

    // reload realtime
    setTimeout(async () => {
      const { expenses } = await loadTransactionsFromGoogleSheet();
      if (expenses.length > 0) setTxns(expenses);
    }, 1200);
  };

  const updateCats = (c) => { setCats(c); };

  if (!user) return (
    <>
      <ToastContainer toasts={toasts} remove={removeToast} />
      <LoginPage onLogin={login} />
    </>
  );

  const pages = {
    dashboard:    <Dashboard txns={txns} incomes={incomes} cats={cats} user={user} setView={setView} />,
    upload:       <UploadPage cats={cats} user={user} onSave={saveTxn} toast={addToast} />,
    transactions: user.role==='admin'
      ? <TxnList txns={txns} cats={cats} user={user} onUpdate={updateTxn} toast={addToast} />
      : <Dashboard txns={txns} incomes={incomes} cats={cats} user={user} setView={setView} />,
    income_transactions: user.role==='admin' ? <IncomeUploadPage onSave={saveIncome} toast={addToast} /> : null,
    categories:   user.role==='admin' ? <CatsPage cats={cats} setCats={updateCats} toast={addToast} /> : null,
    settings:     <SettingsPage toast={addToast} />,
  };

  return (
    <>
      <ToastContainer toasts={toasts} remove={removeToast} />
      <div className="min-h-screen bg-zinc-950 flex">
        <Sidebar view={view} setView={setView} user={user} logout={logout} open={sidebarOpen} setOpen={setSidebarOpen} />

        <div className="flex-1 lg:ml-60 flex flex-col min-h-screen">
          {/* Topbar */}
          <header className="sticky top-0 z-20 bg-zinc-950/80 backdrop-blur-md border-b border-zinc-800/60 px-4 lg:px-6 h-14 flex items-center gap-3">
            <button className="lg:hidden text-zinc-500 hover:text-zinc-200 transition-colors" onClick={() => setSidebarOpen(true)}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <div className="hidden sm:flex items-center gap-1.5 text-xs text-zinc-600 font-mono">
              <span className="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse" />
              {new Date().toLocaleDateString('id-ID',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}
            </div>
            <div className="flex-1" />
            {user.role==='admin' && <span className="hidden sm:inline text-[10px] font-bold text-amber-500/80 bg-amber-500/10 border border-amber-500/20 px-2 py-0.5 rounded-full uppercase tracking-widest">Admin</span>}
            <div className="flex items-center gap-2">
              <div className="w-7 h-7 rounded-full bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-xs font-bold text-cyan-400">{user.initials}</div>
              <span className="text-xs text-zinc-500 hidden sm:block">{user.name}</span>
            </div>
          </header>

          {/* Content */}
          <main className="flex-1 p-4 lg:p-6 overflow-auto" key={view}>
            {pages[view] || pages.dashboard}
          </main>
        </div>
      </div>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const texts = [
    'Integrasi AI',
    'Data & Database',
    'Info Aplikasi',
    'Akun Demo'
  ];

  document.querySelectorAll('div,section,article').forEach(el => {
    const t = el.innerText || '';
    if (texts.some(x => t.includes(x))) {
      el.style.display = 'none';
    }
  });
});
</script>


<script>
window.addEventListener('DOMContentLoaded', () => {
  const keywords = [
    'Pengaturan',
    'Integrasi AI',
    'Data & Database',
    'Info Aplikasi',
    'Akun Demo',
    'Konfigurasi sistem dan integrasi AI'
  ];

  document.querySelectorAll('*').forEach(el => {
    const text = (el.innerText || '').trim();

    if (keywords.includes(text)) {
      el.style.display = 'none';
    }
  });
});
</script>
